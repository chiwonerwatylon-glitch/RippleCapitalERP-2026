{% extends "base.html" %}

{% block title %}Client - {% block client_title %}{% endblock %}{% endblock %}

{% block content %}
<style>
    :root {
        /* Ripple brand tokens (if not already global from brand.css) */


    }

    .client-layout-row {
        margin-top: 0.5rem;
    }

    .client-sidebar-card {
        background: var(--bs-card-bg);
        border-radius: 1rem;
        border: 1px solid var(--ripple-gray-200);
        box-shadow: var(--ripple-shadow-md);
        overflow: hidden;
    }

    .client-sidebar-header {
        padding: 1rem 1.1rem;
        background: linear-gradient(135deg, var(--ripple-primary) 0%, var(--ripple-primary-light) 100%);
        color: var(--ripple-gray-50);
        font-size: 0.9rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    .client-sidebar-header i {
        font-size: 0.95rem;
    }

    .client-sidebar-list {
        padding: 0.6rem 0.4rem 0.8rem;
    }

    .client-link {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.55rem 0.9rem;
        border-radius: 0.65rem;
        margin: 0.1rem 0.3rem;
        font-size: 0.9rem;
        font-weight: 500;
        color: var(--ripple-gray-700);
        text-decoration: none;
        transition: background 0.16s ease, color 0.16s ease, transform 0.12s ease, box-shadow 0.16s ease;
    }

    .client-link i {
        width: 18px;
        text-align: center;
        font-size: 0.85rem;
        color: var(--ripple-gray-500);
    }

    .client-link:hover {
        background: var(--ripple-primary-lighter);
        color: var(--ripple-primary);
        box-shadow: 0 4px 12px rgba(27, 112, 45, 0.18);
        transform: translateY(-1px);
    }

    .client-link-active {
        background: linear-gradient(135deg, var(--ripple-primary) 0%, var(--ripple-primary-light) 100%);
        color: #ffffff;
        box-shadow: 0 10px 22px rgba(27, 112, 45, 0.4);
    }

    .client-link-active i {
        color: #fef9c3;
    }

    .client-main-col {
        margin-top: 0.5rem;
    }

    @media (max-width: 768px) {
        .client-layout-row {
            margin-top: 0;
        }

        .client-sidebar-card {
            margin-bottom: 1rem;
        }
    }
</style>

<div class="row client-layout-row">
    <div class="col-12 col-md-3 mb-3">
        <div class="client-sidebar-card">
            <div class="client-sidebar-header">
                <i class="fas fa-shield-heart"></i>
                <span>Client Portal</span>
            </div>
            <div class="client-sidebar-list">
                <a href="{{ url_for('core.client_dashboard') }}"
                   class="client-link{% if request.endpoint == 'core.client_dashboard' %} client-link-active{% endif %}">
                    <i class="fas fa-gauge-high"></i>
                    <span>Dashboard</span>
                </a>
                <a href="{{ url_for('auth.logout') }}" class="client-link">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </div>
        </div>
    </div>
    <div class="col-12 col-md-9 client-main-col">
        {% block client_content %}{% endblock %}
    </div>
</div>
{% endblock %}
