{% extends "layout_agent.html" %}
{% block agent_title %}Admin Dashboard{% endblock %}
{% block agent_content %}
<h3>Admin Panel</h3>
<div class="row mb-4">
    <div class="col-md-3">
        <div class="card text-bg-light mb-3">
            <div class="card-body">
                <h5 class="card-title">Companies</h5>
                <p class="card-text fs-4">{{ companies_count }}</p>
                <a class="btn btn-sm btn-primary" href="{{ url_for('admin.companies') }}">Manage Companies</a>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-bg-light mb-3">
            <div class="card-body">
                <h5 class="card-title">Users</h5>
                <p class="card-text fs-4">{{ users_count }}</p>
            </div>
        </div>
    </div>
</div>

<a href="{{ url_for('admin.manual_journal') }}" class="btn btn-outline-secondary">Manual Journal</a>
{% endblock %}
