{% load static %}
<header class="navbar">
  <div class="navbar-left">
    <button class="navbar-toggle" id="sidebarToggle" aria-label="Toggle navigation">
      ☰
    </button>
    <a href="{% url 'core:dashboard-home' %}" class="navbar-brand">
      <span class="brand-mark">RC</span>
      <span class="brand-text">Ripple Capital ERP</span>
    </a>
  </div>
  <div class="navbar-right">
    {% if user.is_authenticated %}
      <div class="navbar-user">
        <span class="navbar-user-name">
          {{ user.get_full_name|default:user.username }}
        </span>
        <span class="navbar-user-role">
          {{ user.get_role_display|default:"User" }}
        </span>
      </div>
      <a href="{% url 'accounts:logout' %}" class="btn btn-sm btn-outline-light">
        Logout
      </a>
    {% endif %}
  </div>
</header>
